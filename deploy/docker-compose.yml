# Josour control plane: Caddy (TLS) + FastAPI (1 worker) + PostgreSQL + daily backup
# Usage: cp .env.example .env && docker compose up -d
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      ENV: prod
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-30}
      # Rate limiting (ADR-0008). The defaults here are the code's defaults; they are stated explicitly so the operator can tune them.
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LOGIN_RATE_LIMIT_PER_MINUTE: ${LOGIN_RATE_LIMIT_PER_MINUTE:-30}
      LOGIN_EMAIL_RATE_LIMIT: ${LOGIN_EMAIL_RATE_LIMIT:-5}
      LOGIN_EMAIL_RATE_LIMIT_WINDOW_MINUTES: ${LOGIN_EMAIL_RATE_LIMIT_WINDOW_MINUTES:-15}
      # Suspicious-device detection (ADR-0008). A zero for any threshold disables that rule alone.
      DEVICE_RISK_ENABLED: ${DEVICE_RISK_ENABLED:-true}
      DEVICE_RISK_INTERVAL_SECONDS: ${DEVICE_RISK_INTERVAL_SECONDS:-300}
      DEVICE_RISK_WINDOW_MINUTES: ${DEVICE_RISK_WINDOW_MINUTES:-60}
      DEVICE_RISK_SECRET_FAILURES: ${DEVICE_RISK_SECRET_FAILURES:-10}
      DEVICE_RISK_REFRESH_REUSE: ${DEVICE_RISK_REFRESH_REUSE:-3}
      # Relay (ADR-0009). Leave RELAY_HOST empty to run direct-only; setting one of the two
      # without the other stops the API at boot rather than degrading every session in silence.
      RELAY_HOST: ${RELAY_HOST:-}
      RELAY_PORT: ${RELAY_PORT:-443}
      RELAY_SECRET: ${RELAY_SECRET:-}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do /usr/local/bin/backup.sh; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  caddy_data:
  caddy_config:
