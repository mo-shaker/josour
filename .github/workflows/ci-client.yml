name: ci-client

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/ci-client.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/ci-client.yml"]

jobs:
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore Josour.sln
      - name: Build
        run: dotnet build Josour.sln --no-restore -c Release -warnaserror:nullable
      - name: Test
        run: dotnet test Josour.sln --no-build -c Release --filter "Category!=Benchmark" --logger "trx;LogFileName=results.trx"

      # Throughput and timing on a shared runner: the numbers are for reading, so a missed criterion warns rather than
      # failing the job (and skipping the QA artifact below).
      - name: Mux benchmarks (informational, ADR-0006 criteria)
        continue-on-error: true
        run: dotnet test tests/Josour.Tunnel.Tests --no-build -c Release --filter "Category=Benchmark" --logger "console;verbosity=detailed"
      # The same single self-contained Josour.exe a user is given (scripts/publish-exe.ps1 refuses a publish that
      # leaves anything beside it). Releases come from release-client.yml; this one is for QA of a commit.
      - name: Publish Josour.exe (unsigned, artifact for QA)
        shell: pwsh
        run: ../scripts/publish-exe.ps1 -Output publish/exe
      - uses: actions/upload-artifact@v4
        with:
          name: josour-exe-unsigned
          path: client/publish/exe/Josour.exe
          retention-days: 14

  build-macos:
    # ADR-0013: macOS is a supported platform, not a place the libraries merely compile. This job builds the
    # app itself and runs the headless UI tests, so a view that only loads on Windows fails here.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the app for macOS
        run: dotnet build src/Josour.App -c Release -f net8.0
      - name: Test
        run: |
          for p in Core Tunnel Proxy Egress Infrastructure E2E App; do
            dotnet test tests/Josour.$p.Tests -c Release --filter "Category!=Benchmark"
          done

  build-linux:
    # Proves the libraries build and test off Windows and macOS too
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test libraries
        run: |
          for p in Core Tunnel Proxy Egress Infrastructure E2E; do
            dotnet test tests/Josour.$p.Tests -c Release --filter "Category!=Benchmark"
          done
