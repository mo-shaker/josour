name: ci-backend

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/ci-backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: routebridge
          POSTGRES_PASSWORD: routebridge
          POSTGRES_DB: routebridge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U routebridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql+asyncpg://routebridge:routebridge@localhost:5432/routebridge_test
      JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations apply cleanly
        run: alembic upgrade head
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}
      - name: Tests
        run: pytest -q
      - name: Docker image builds
        run: docker build -t josour-api:ci .
