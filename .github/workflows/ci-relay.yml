name: ci-relay

on:
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/ci-relay.yml"]
  pull_request:
    paths: ["relay/**", ".github/workflows/ci-relay.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: relay/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests
        run: pytest -q
      - name: Docker image builds
        run: docker build -t josour-relay:ci .
