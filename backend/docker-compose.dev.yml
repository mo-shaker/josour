# Development-only PostgreSQL. Production compose lives in /deploy.
#   docker compose -f docker-compose.dev.yml up -d db
#   docker compose -f docker-compose.dev.yml down -v
name: routebridge-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: routebridge
      POSTGRES_PASSWORD: routebridge
      POSTGRES_DB: routebridge
    ports:
      - "5433:5432"
    volumes:
      - routebridge-dev-db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U routebridge -d routebridge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  routebridge-dev-db:
